# Vigilante PS5 Pro: revisa las tiendas cada 10 minutos y avisa por Telegram.
# Ruta dentro del repositorio: .github/workflows/vigilante-ps5.yml
#
# Notas:
# - El cron va en UTC; el intervalo de 10 minutos no depende de la zona horaria.
# - GitHub puede retrasar las ejecuciones programadas en horas de mucha carga.
# - En repositorios públicos, GitHub pausa los cron tras 60 días sin commits:
#   se reactivan en la pestaña Actions con "Enable workflow".
# - Las Actions van fijadas por SHA (versión exacta e inmutable).
 
name: Vigilante PS5 Pro
 
on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch: {}  # botón "Run workflow" para lanzarlo a mano
 
permissions:
  contents: read  # solo lectura: el workflow no puede modificar el repositorio
 
concurrency:
  group: vigilante-ps5
  cancel-in-progress: false
 
jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
 
      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
 
      - name: Instalar dependencias fijadas
        run: python -m pip install --disable-pip-version-check -r requirements.txt
 
      - name: Recuperar el estado de la ejecución anterior
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state.json
          key: vigilante-estado-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vigilante-estado-
 
      - name: Revisar tiendas y avisar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python vigilante.py
 
      - name: Guardar el estado para la próxima ejecución
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state.json
          key: vigilante-estado-${{ github.run_id }}-${{ github.run_attempt }}
 
